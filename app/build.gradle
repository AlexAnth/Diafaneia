apply plugin: 'com.android.application'
apply plugin: 'realm-android'




android {
    namespace "com.example.alex.diafaneia"
    compileSdkVersion 36


    defaultConfig {
        applicationId "com.alex.diafaneia"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode 24
        versionName "24.0"
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

realm {
    syncEnabled = true
}

dependencies {
    // Aligns kotlin-stdlib-jdk7/jdk8 (pulled in transitively at 1.6.0) with the merged 1.8+ stdlib.
    // Unlike a global resolutionStrategy.force, this leaves AGP's lint classpath alone.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation('com.android.volley:volley:1.2.1') {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.android.gms:play-services-appindexing:9.8.0'
    testImplementation 'junit:junit:4.13.2'
    implementation 'com.google.code.gson:gson:2.10.1'
}
